[package]
name = "slint-mobile-components-wasm-viewer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Browser build of the slint-mobile-components catalogue — 145 page templates rendered as an infinite-scroll grid, compiled to wasm."
publish = false

# cdylib is what wasm-pack needs to emit the .wasm file; rlib lets
# `cargo check` run normally without forcing a wasm build during
# development.
#
# Build for production with:
#   wasm-pack build --release --target web crates/wasm-viewer \
#     --out-dir ../../dist/pkg --no-typescript
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Slint on wasm: backend-winit + renderer-femtovg is the supported
# combo (Skia doesn't compile to wasm32-unknown-unknown).
slint = { version = "1", default-features = false, features = [
    "compat-1-2",
    "std",
    "backend-winit",
    "renderer-femtovg",
] }
# `features = ["internal"]` exposes `ComponentDefinition::create_embedded`,
# the documented bridge for plugging an interpreted component into a
# `ComponentContainer` slot. Same posture as the desktop viewer.
slint-interpreter = { version = "1", features = ["internal"] }
# Bundle every .slint source in the workspace into the wasm binary
# at compile time. The interpreter then resolves imports against the
# embedded directory tree instead of std::fs.
include_dir = "0.7"
# pollster::block_on for the slint-interpreter Compiler::build_from_source
# call (it returns a Future; the wasm event loop doesn't have an async
# executor wired in, and this Future resolves immediately because
# set_file_loader returns synchronously-ready data).
pollster = "0.3"
# Workspace crates we read library paths from.
slint-mobile-theme = { path = "../theme" }
slint-mobile-components-widgets = { path = "../components" }
# slint-mapping at runtime: TileSource trait + camera/viewport math
# (base, all targets). The wasm32 target additionally enables the
# `wasm` feature below for `WasmOsmTileSource`, which lazily fetches
# tiles over XHR from our same-origin `dist/tiles/` static assets —
# so the ~2.4 MB tile bundle is NOT embedded in the wasm binary and
# only the visible tiles for the 6 map pages are pulled, on demand.
slint-mapping = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
# `wasm` feature → `WasmOsmTileSource` (XHR tile fetch + LRU decode).
# Cargo unions this with the base `slint-mapping` dep above, so the
# wasm feature is only on for the wasm32 target; a native `cargo
# check` keeps the lean base build. Pulls `image` (jpeg decode) +
# `lru` transitively, so we no longer need our own `image` dep.
slint-mapping = { version = "0.1", features = ["wasm"] }

[build-dependencies]
slint-build = "1"
slint-mobile-theme = { path = "../theme" }
slint-mobile-components-widgets = { path = "../components" }
# slint-mapping at build time for two things:
#   - `UI_LIBRARY_DIR` const → the pre-bake step uses it so map pages
#     resolve `import { MapEmbed } from "@mapping/map.slint";`.
#   - `SAMPLE_TILES_DIR` const → points at the PNG tile bundle that
#     ships inside the published crate. We re-encode those PNGs as
#     JPEG-Q70 into $OUT_DIR/jpeg-tiles at build time, then include
#     them via `include_dir!`. Keeps the wasm-viewer's own repo
#     tile-free (one less binary blob to track).
slint-mapping = "0.1"
# base64 for the build-time pre-rewriter that inlines every
# @image-url(...) reference into a `data:image/<mime>;base64,...` URL,
# so the runtime interpreter never has to hit a filesystem.
base64 = "0.22"
walkdir = "2"
# Image re-encoding pipeline: png decoder + jpeg encoder. PNG is
# what slint-mapping ships; JPEG-Q70 is ~3× smaller per tile and
# good enough for OSM photo-like map data.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
