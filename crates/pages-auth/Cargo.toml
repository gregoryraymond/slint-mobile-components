[package]
name = "slint-mobile-pages-auth"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Page templates (auth category) for slint-mobile-components."
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
slint = { version = "1", default-features = false, features = [
    "compat-1-2",
    "std",
] }
slint-mobile-theme = { path = "../theme" }
slint-mobile-components-widgets = { path = "../components" }
# Published crate (not a sibling path dep) so CI runners that only
# check out this repo can resolve it. Map-using pages `import
# { MapEmbed } from "@mapping/map.slint";`.
slint-mapping = "0.1"

[build-dependencies]
slint-build = "1"
slint-mobile-theme = { path = "../theme" }
slint-mobile-components-widgets = { path = "../components" }
slint-mapping = "0.1"
