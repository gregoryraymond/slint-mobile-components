<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 892" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="vwSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a0a4d"/>
      <stop offset="35%"  stop-color="#5b1170"/>
      <stop offset="55%"  stop-color="#c21d8a"/>
      <stop offset="62%"  stop-color="#ff6a9e"/>
      <stop offset="64%"  stop-color="#1a0633"/>
      <stop offset="100%" stop-color="#070118"/>
    </linearGradient>
    <linearGradient id="vwSun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffe65c"/>
      <stop offset="50%"  stop-color="#ff7eb6"/>
      <stop offset="100%" stop-color="#ff2fae"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00f0ff" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="412" height="892" fill="url(#vwSky)"/>
  <!-- sun disc above the horizon (horizon at ~571) -->
  <circle cx="206" cy="500" r="120" fill="url(#vwSun)"/>
  <!-- sun banding (negative space stripes) -->
  <g fill="#1a0633">
    <rect x="86" y="548" width="240" height="6"/>
    <rect x="86" y="536" width="240" height="5"/>
    <rect x="86" y="524" width="240" height="4"/>
    <rect x="86" y="514" width="240" height="3"/>
  </g>
  <!-- perspective floor grid below horizon -->
  <g stroke="url(#gridFade)" stroke-width="1.5" fill="none">
    <line x1="206" y1="571" x2="-260" y2="892"/>
    <line x1="206" y1="571" x2="-90"  y2="892"/>
    <line x1="206" y1="571" x2="60"   y2="892"/>
    <line x1="206" y1="571" x2="206"  y2="892"/>
    <line x1="206" y1="571" x2="352"  y2="892"/>
    <line x1="206" y1="571" x2="502"  y2="892"/>
    <line x1="206" y1="571" x2="672"  y2="892"/>
  </g>
  <g stroke="#00f0ff" stroke-width="1.5" fill="none">
    <line x1="0" y1="600" x2="412" y2="600" stroke-opacity="0.30"/>
    <line x1="0" y1="640" x2="412" y2="640" stroke-opacity="0.42"/>
    <line x1="0" y1="695" x2="412" y2="695" stroke-opacity="0.55"/>
    <line x1="0" y1="765" x2="412" y2="765" stroke-opacity="0.7"/>
    <line x1="0" y1="850" x2="412" y2="850" stroke-opacity="0.85"/>
  </g>
</svg>
