<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 892" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="termBase" cx="50%" cy="30%" r="90%">
      <stop offset="0%"   stop-color="#06281c"/>
      <stop offset="55%"  stop-color="#031a11"/>
      <stop offset="100%" stop-color="#010c08"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0 H0 V34" fill="none" stroke="#0aff8c" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <pattern id="scan" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#0aff8c" fill-opacity="0.04"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="22%" r="40%">
      <stop offset="0%"  stop-color="#0aff8c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0aff8c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="412" height="892" fill="url(#termBase)"/>
  <rect width="412" height="892" fill="url(#grid)"/>
  <rect width="412" height="892" fill="url(#scan)"/>
  <rect width="412" height="892" fill="url(#glow)"/>
</svg>
