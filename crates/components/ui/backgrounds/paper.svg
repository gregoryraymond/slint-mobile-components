<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 892" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="paperBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f7f2e7"/>
      <stop offset="40%"  stop-color="#f3ede1"/>
      <stop offset="100%" stop-color="#ece3d2"/>
    </linearGradient>
    <radialGradient id="press" cx="50%" cy="0%" r="70%">
      <stop offset="0%"  stop-color="#fffdf6" stop-opacity="0.8"/>
